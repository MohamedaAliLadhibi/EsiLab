name: esilab

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab_catalogue}
      POSTGRES_USER: ${POSTGRES_USER:-esilab_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  public-api:
    build:
      context: ./backend2
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lab_catalogue}
      DB_USER: ${POSTGRES_USER:-esilab_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_POOL_MIN: "0"
      DB_POOL_MAX: "5"
    depends_on:
      postgres:
        condition: service_healthy

  admin-api:
    build:
      context: ./backend2
      dockerfile: Dockerfile
    command: ["node", "src/adminServer.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      ADMIN_PORT: "3001"
      ADMIN_CORS_ORIGINS: https://${ADMIN_DOMAIN:-admin.esilab-tn.com}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lab_catalogue}
      DB_USER: ${POSTGRES_USER:-esilab_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_POOL_MIN: "0"
      DB_POOL_MAX: "5"
      REDIS_URL: redis://redis:6379
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  public-site:
    build:
      context: ./lab-site
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN:-api.esilab-tn.com}/api
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:-www.esilab-tn.com}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4001"
      NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN:-api.esilab-tn.com}/api
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:-www.esilab-tn.com}
      API_BASE_URL: http://public-api:3000/api
    depends_on:
      - public-api

  admin-site:
    build:
      context: ./lab-admin2
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      ADMIN_API_URL: http://admin-api:3001
    depends_on:
      - admin-api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APEX_DOMAIN: ${APEX_DOMAIN:-esilab-tn.com}
      SITE_DOMAIN: ${SITE_DOMAIN:-www.esilab-tn.com}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.esilab-tn.com}
      API_DOMAIN: ${API_DOMAIN:-api.esilab-tn.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - public-site
      - admin-site
      - public-api

volumes:
  postgres18_data:
  redis_data:
  caddy_data:
  caddy_config:
